[package]
name = "ocloak"
version = "0.1.0"
description = "Open RFC 9458 OHTTP Relay"
authors = ["kpcyrd <git@rxv.cc>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/kpcyrd/ocloak"
keywords = ["ohttp", "rfc9458", "rfc9540", "proxy"]
edition = "2024"

[dependencies]
anyhow = "1"
arc-swap = "1"
clap = { version = "4", features = ["derive", "env"] }
domain = { version = "0.12", features = ["resolv"] }
env_logger = "0.11"
futures-util = { version = "0.3", default-features = false }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service", "http1"] }
log = "0.4"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.13", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3", default-features = false, features = ["alloc", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-rustls = "0.26"
tokio-util = "0.7"
toml = "1"
tower-service = "0.3"
url = "2"
warp = { version = "0.4", features = ["server"] }
