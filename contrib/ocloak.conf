[daemon]
bind = "127.0.0.1:8080"

# TODO: max request size

[[allowed]]
hosts = ["ohttp.test.orca.toys", "target.ohttp.info", "example.com", "ccc.de", "crypto.cloudflare.com", "x.y.z.abc"]
arbitrary_paths = true

[[allowed]]
hosts = ["*"]
# Uses RFC-9540
require_dns_ohttp_discovery = true
path = "/.well-known/ohttp-gateway"
