[daemon]
bind_addr = "127.0.0.1:1312"

[defaults]
max_request_size = "8 MiB"
user_agent = "ohttp-relay"
connect_timeout = "15s"
read_timeout = "30s"
max_redirects = 2

## Allow specific hosts, the request path is pinned to the RFC default /.well-known/ohttp-gateway
#[[allowed]]
#hosts = ["example.com"]

## Allow specific hosts, the user may request arbitrary paths for their forwarded request
#[[allowed]]
#hosts = ["example.com"]
#arbitrary_paths = true

## Allow specific hosts with a fixed, non-default path
#[[allowed]]
#hosts = ["example.com"]
#path = "/.not-well-known/ohttp-gateway"

## Allow any host that indicates OHTTP support in their DNS HTTPS records
[[allowed]]
hosts = ["*"]
## Uses RFC-9540
require_dns_ohttp_discovery = true
