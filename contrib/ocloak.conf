[daemon]
bind_addr = "127.0.0.1:1312"

[defaults]
max_request_size = "8 MiB"
user_agent = "ohttp-relay"
connect_timeout = "15s"
read_timeout = "30s"
max_redirects = 2

[[allowed]]
hosts = ["ohttp.test.orca.toys", "ohttp-repro.exe.xyz", "target.ohttp.info", "example.com", "ccc.de", "crypto.cloudflare.com", "x.y.z.abc"]
arbitrary_paths = true

[[allowed]]
hosts = ["*"]
# Uses RFC-9540
require_dns_ohttp_discovery = true
path = "/.well-known/ohttp-gateway"
